[build]
  publish = "."
  command = ""

# Force HTTPS
[[redirects]]
  from = "http://getdeadhand.com/*"
  to = "https://getdeadhand.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.getdeadhand.com/*"
  to = "https://getdeadhand.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.getdeadhand.com/*"
  to = "https://getdeadhand.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com"

# Long cache for the immutable wordmark asset
[[headers]]
  for = "/deadhand-wordmark.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/deadhand-share.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

