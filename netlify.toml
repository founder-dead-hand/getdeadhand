[build]
  publish = "."
  command = ""

# Force HTTPS
[[redirects]]
  from = "http://getdeadhand.com/*"
  to = "https://getdeadhand.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.getdeadhand.com/*"
  to = "https://getdeadhand.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.getdeadhand.com/*"
  to = "https://getdeadhand.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https://lcmfxikfvrxdiznxepoa.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com"

# Long cache for the immutable wordmark asset
[[headers]]
  for = "/deadhand-wordmark.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/for-plumbers"
  to = "/for-plumbers.html"
  status = 200

[[redirects]]
  from = "/for-hvac"
  to = "/for-hvac.html"
  status = 200

[[redirects]]
  from = "/for-electrical"
  to = "/for-electrical.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/sms-policy"
  to = "/sms-policy.html"
  status = 200
